<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hermes Usage Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            padding: 24px;
            min-height: 100vh;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 24px;
            color: #fff;
        }
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a4a;
        }
        .stat-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
        }
        .stat-value.tokens { color: #60a5fa; }
        .stat-value.cost { color: #4ade80; }
        .table-container {
            background: #1a1a2e;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #2a2a4a;
        }
        th:last-child, td:last-child { text-align: right; }
        td {
            padding: 12px 16px;
            border-bottom: 1px solid #1f1f35;
        }
        tr:hover { background: #1f1f35; }
        td:first-child { font-weight: 600; color: #fff; }
        td:last-child { color: #4ade80; }
        #status { color: #ffcc00; font-size: 14px; margin-bottom: 16px; }
        #error { color: #ff4444; font-size: 14px; margin-bottom: 16px; }
        .loading { text-align: center; padding: 40px; color: #666; }
    </style>
</head>
<body>
    <h1>Hermes Usage Dashboard</h1>
    <div id="status">Loading...</div>
    <div id="error"></div>
    <div id="content">
        <div class="loading">Loading usage data...</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        const errorEl = document.getElementById('error');
        const contentEl = document.getElementById('content');

        function showError(msg) {
            statusEl.textContent = 'Error';
            errorEl.textContent = msg;
            contentEl.innerHTML = '';
            console.error(msg);
        }

        function renderDashboard(data) {
            statusEl.textContent = 'Connected';
            statusEl.style.color = '#4ade80';

            const providers = data.providers || [];
            const totalTokens = data.total_tokens || 0;
            const totalCost = data.total_cost_usd || 0;

            let rows = '';
            for (const p of providers) {
                const cost = typeof p.cost_usd === 'number' ? '$' + p.cost_usd.toFixed(4) : p.cost_usd;
                const tokens = typeof p.tokens_used === 'number' ? p.tokens_used.toLocaleString() : p.tokens_used;
                rows += `<tr>
                    <td>${escapeHtml(p.name)}</td>
                    <td>${tokens}</td>
                    <td>${cost}</td>
                </tr>`;
            }

            contentEl.innerHTML = `
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-label">Total Tokens</div>
                        <div class="stat-value tokens">${totalTokens.toLocaleString()}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Total Cost</div>
                        <div class="stat-value cost">$${totalCost.toFixed(2)}</div>
                    </div>
                </div>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Provider</th>
                                <th>Tokens</th>
                                <th>Cost</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${rows}
                        </tbody>
                    </table>
                </div>
            `;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function loadData() {
            // Check if running inside Tauri
            if (window.__TAURI__) {
                statusEl.textContent = 'Connecting to Tauri backend...';
                try {
                    const result = await window.__TAURI__.invoke('get_usage_summary');
                    const data = typeof result === 'string' ? JSON.parse(result) : result;
                    renderDashboard(data);
                } catch (e) {
                    showError('Tauri invoke failed: ' + e.message);
                }
            } else {
                // Running in plain browser — use mock data
                statusEl.textContent = 'Running in browser mode (mock data)';
                statusEl.style.color = '#ffcc00';
                renderDashboard({
                    providers: [
                        { name: 'openrouter', tokens_used: 15000, cost_usd: 0.45 },
                        { name: 'anthropic', tokens_used: 8000, cost_usd: 0.24 },
                        { name: 'openai', tokens_used: 12000, cost_usd: 0.36 }
                    ],
                    total_tokens: 35000,
                    total_cost_usd: 1.05
                });
            }
        }

        loadData();
    </script>
</body>
</html>
