[package]
name = "hermes-dashboard-ui"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hermes-monitor = { path = "../monitor", default-features = false, features = ["types"] }
yew = { version = "0.21", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
