[package]
name = "hermes-dashboard-ui"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
strip = true
debug = false

[dependencies]
yew = { version = "0.21", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
gloo = { version = "0.8", features = ["events"] }
hermes-monitor = { path = "../monitor", default-features = false, features = ["types"] }
