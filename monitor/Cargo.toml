[package]
name = "hermes-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
influxdb2 = "0.3"
once_cell = "1"
async-trait = "0.1"
thiserror = "1"
dirs = "5"
config = "0.14"
log = "0.4"
env_logger = "0.10"
