[package]
name = "hermes-dashboard-tauri"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
once_cell = "1"
dirs = "5"
config = "0.14"
log = "0.4"
env_logger = "0.10"
hermes-monitor = { path = "../monitor" }
serde_json = "1"
