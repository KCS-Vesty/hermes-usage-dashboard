[package]
name = "hermes-dashboard-tauri"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
tauri = { version = "2", features = ["api-all"] }
tauri-plugin-notification = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
influxdb2 = "0.3"
once_cell = "1"
dirs = "5"
config = "0.14"
log = "0.4"
env_logger = "0.10"
hermes-monitor = { path = "../monitor" }
